<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>stellar-web-sdk — vanilla JS example</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h1>Stellar swap</h1>
    <p class="lead">
      Vanilla JS on the core <code>StellarSwapSDK</code>. One quote routes automatically: Stellar
      in-chain when it can serve the pair, else cross-chain. <b>Mainnet only</b> — use a
      dedicated, low-balance account; the secret key stays in your browser.
    </p>

    <fieldset>
      <label>Soroswap API key (optional) <input id="soroswapApiKey" type="password" placeholder="sk_… — without it Soroswap declines" /></label>
      <label>StellarBroker partner key (optional, needed to commit an SB route) <input id="brokerPartnerKey" type="password" placeholder="partner key" /></label>
      <label>Sell asset <input id="sellAsset" value="XLM.XLM" /></label>
      <label>Buy asset (try <code>ETH.USDC-0X…</code> for a cross-chain route)
        <input id="buyAsset" value="XLM.USDC-GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN" /></label>
      <label>Sell amount <input id="sellAmount" value="10" /></label>
      <label>Slippage (%) <input id="slippage" value="1" /></label>
      <label>Secret key (S…) — signs a Stellar-origin swap/deposit <input id="secretKey" type="password" placeholder="S… (kept client-side)" /></label>
      <label>Destination address (optional) — cross-chain or third-party; defaults to your account
        <input id="destination" placeholder="0x… / bc1… / G…" /></label>
      <label>Source address (optional) — only for a non-Stellar origin with no secret key
        <input id="source" placeholder="origin-chain address" /></label>
    </fieldset>

    <div class="row">
      <button id="quoteBtn">Get quote</button>
      <button id="trustBtn" hidden>Activate trustline</button>
      <button id="swapBtn" disabled>Swap</button>
    </div>

    <div id="results"></div>

    <script type="module" src="./app.bundle.js"></script>
  </body>
</html>
